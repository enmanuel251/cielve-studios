<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cielve Studios — Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: #15151c;
      padding: 30px;
      border-radius: 16px;
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      border: 0;
      font-size: 16px;
    }

    input {
      background: #252530;
      color: white;
    }

    button {
      background: white;
      color: black;
      cursor: pointer;
      font-weight: bold;
    }

    #message {
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Cielve Studios</h1>
    <p>Panel de desarrolladores</p>

    <input id="email" type="email" placeholder="Correo">
    <input id="password" type="password" placeholder="Contraseña">

    <button onclick="login()">Iniciar sesión</button>

    <p id="message"></p>
  </div>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "PON_AQUI_TU_PROJECT_URL";
    const SUPABASE_KEY = "PON_AQUI_TU_PUBLISHABLE_KEY";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    window.login = async function () {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      message.textContent = "Iniciando sesión...";

      const { error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        message.textContent = "Correo o contraseña incorrectos.";
        return;
      }

      window.location.href = "dashboard.html";
    };
  </script>

</body>
</html>
