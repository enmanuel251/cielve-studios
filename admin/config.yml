backend:
  name: github
  repo: enmanuel251/cielve-studios
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "paginas"
    label: "Páginas"
    files:

      - file: "index.html"
        label: "Página principal"
        name: "inicio"
        fields:

          - label: "Título"
            name: "title"
            widget: "string"

          - label: "Descripción"
            name: "description"
            widget: "text"

      - file: "redes.html"
        label: "Redes sociales"
        name: "redes"
        fields:

          - label: "Contenido"
            name: "content"
            widget: "markdown"