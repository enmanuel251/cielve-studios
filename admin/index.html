<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cielve Studios - Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .admin-box {
            width: 90%;
            max-width: 450px;
            padding: 40px;
            background: #111;
            border: 1px solid #333;
            border-radius: 15px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #aaa;
        }

        .logo {
            width: 100px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div class="admin-box">

        <h1>Cielve Studios</h1>

        <p>Panel de administración</p>

        <p>🔒 Acceso privado</p>

    </div>

</body>
</html>
