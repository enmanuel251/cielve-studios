<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cielve Studios - Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .admin-box {
            width: 90%;
            max-width: 420px;

            padding: 40px;

            background: #111;

            border: 1px solid #333;
            border-radius: 18px;

            text-align: center;

            box-shadow: 0 0 30px rgba(255,255,255,0.08);
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
        }

        input {
            width: 100%;

            padding: 14px;
            margin: 8px 0;

            background: #222;
            color: white;

            border: 1px solid #444;
            border-radius: 8px;

            outline: none;
        }

        input:focus {
            border-color: white;
        }

        button {
            width: 100%;

            padding: 14px;
            margin-top: 12px;

            background: white;
            color: black;

            border: none;
            border-radius: 8px;

            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        #mensaje {
            margin-top: 18px;
            min-height: 20px;
        }
    </style>
</head>

<body>

    <div class="admin-box">

        <h1>Cielve Studios</h1>

        <p class="subtitle">
            Panel de administración
        </p>

        <input
            type="email"
            id="email"
            placeholder="Correo electrónico"
            autocomplete="email"
        >

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
            autocomplete="current-password"
        >

        <button id="loginButton">
            Entrar
        </button>

        <p id="mensaje"></p>

    </div>


    <script type="module">

        import { createClient } from
        "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


        // =====================================
        // CONFIGURACIÓN DE SUPABASE
        // =====================================

        const SUPABASE_URL =
            "https://wixdnaeuytxrbdbuutpd.supabase.co";


        const SUPABASE_PUBLISHABLE_KEY =
            "PEGA_AQUI_TU_PUBLISHABLE_KEY";


        const supabase = createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


        // =====================================
        // INICIO DE SESIÓN
        // =====================================

        const loginButton =
            document.getElementById("loginButton");

        const mensaje =
            document.getElementById("mensaje");


        loginButton.addEventListener("click", async () => {

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            if (!email || !password) {

                mensaje.textContent =
                    "⚠️ Escribe tu correo y contraseña.";

                return;
            }


            loginButton.disabled = true;

            loginButton.textContent =
                "Entrando...";


            const { data, error } =
                await supabase.auth.signInWithPassword({

                    email: email,

                    password: password

                });


            if (error) {

                mensaje.textContent =
                    "❌ Correo o contraseña incorrectos.";

                loginButton.disabled = false;

                loginButton.textContent =
                    "Entrar";

                return;
            }


            mensaje.textContent =
                "✅ Acceso correcto.";


            // =================================
            // AQUÍ PONDREMOS EL PANEL
            // =================================

            setTimeout(() => {

                window.location.href =
                    "dashboard.html";

            }, 700);

        });

    </script>

</body>
</html>
